<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Carteras — CSV</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
    h1 { font-size: 1.8rem; margin-bottom: 6px; color: #1a3a5c; }
    .subtitulo { font-size: 0.95rem; color: #666; margin-bottom: 20px; }

    .filtros {
      display: flex; gap: 15px; flex-wrap: wrap; align-items: center;
      margin-bottom: 25px; background: #fff; padding: 15px 20px;
      border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .filtros label { font-weight: 600; font-size: 0.9rem; color: #444; display: flex; align-items: center; gap: 8px; }
    .filtros select {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.9rem; background: #fff; cursor: pointer; max-width: 260px;
    }
    .filtros button {
      padding: 7px 16px; border: none; border-radius: 6px;
      background: #2E86AB; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    .filtros button:hover { background: #1f6a8a; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); text-align: center; }
    .kpi .valor { font-size: 1.7rem; font-weight: 700; color: #1a3a5c; }
    .kpi .etiqueta { font-size: 0.82rem; color: #777; margin-top: 5px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 22px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); display: flex; flex-direction: column; }
    .card h2 { font-size: 1.05rem; margin-bottom: 14px; color: #1a3a5c; border-bottom: 2px solid #e8eef4; padding-bottom: 8px; }
    .card canvas { max-height: 320px; width: 100% !important; }

    .cargando { text-align: center; padding: 60px 20px; font-size: 1.1rem; color: #888; }
    .error { background: #ffecec; color: #a33; padding: 14px 18px; border-radius: 8px; margin-bottom: 18px; border-left: 4px solid #c73e1d; font-size: 0.9rem; }
    .info { background: #eef7ff; color: #1a3a5c; padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; border-left: 4px solid #2E86AB; font-size: 0.88rem; }

    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 1.3rem; } }
  </style>
</head>
<body>

  <h1>Dashboard de Carteras (CSV)</h1>
  <p class="subtitulo">Leyendo datos desde <code>1.csv</code>.</p>

  <div id="contenedorMensajes"></div>

  <!-- Sección de carga manual (fallback) -->
  <div class="filtros" id="panelArchivo">
    <label>
      📂 Seleccionar CSV:
      <input type="file" id="inputArchivo" accept=".csv,text/csv">
    </label>
    <button id="btnRecargar">🔄 Recargar 1.csv</button>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <label>Cartera:
      <select id="filtroCartera"><option value="Todas">Todas</option></select>
    </label>
    <label>Estado:
      <select id="filtroEstado"><option value="Todos">Todos</option></select>
    </label>
    <label>Evaluador:
      <select id="filtroEvaluador"><option value="Todos">Todos</option></select>
    </label>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card"><h2>Proyectos por Estado</h2><canvas id="chartEstado"></canvas></div>
    <div class="card"><h2>Proyectos por Comuna (Top 15)</h2><canvas id="chartComuna"></canvas></div>
    <div class="card"><h2>Proyectos por Evaluador</h2><canvas id="chartEvaluador"></canvas></div>
    <div class="card"><h2>Monto Total por Comuna (Top 15)</h2><canvas id="chartMontoComuna"></canvas></div>
    <div class="card"><h2>Monto Promedio por Cartera</h2><canvas id="chartMontoCartera"></canvas></div>
    <div class="card"><h2>Proyectos por Tipo de Iniciativa</h2><canvas id="chartTipoIniciativa"></canvas></div>
    <div class="card"><h2>Distribución de Montos por Cartera</h2><canvas id="chartBoxMonto"></canvas></div>
    <div class="card"><h2>Proyectos por Formulador (Top 10)</h2><canvas id="chartFormulador"></canvas></div>
  </div>

  <script>
    // ============================================================
    // CONFIGURACIÓN
    // ============================================================
    const ARCHIVO_CSV = '1.csv';   // nombre del archivo a leer
    const SEPARADOR_AUTO = true;   // detecta , ; o \t automáticamente

    const CAMPOS_COMUNES = [
      'codigo_bip', 'nombre', 'tipo_iniciativa', 'comuna',
      'formulador', 'monto_total_m$', 'estado', 'evaluador', 'tipo_cartera', 'origen'
    ];

    let datosGlobales = [];
    const graficos = {};

    const paleta = ['#2E86AB','#A23B72','#F18F01','#C73E1D','#3B1F2B','#6A994E','#BC4B51','#5C8001','#F4A259','#8CB369'];

    // ============================================================
    // UTILIDADES
    // ============================================================
    function formatearMonto(n) { return Math.round(n).toLocaleString('es-CL'); }

    function normalizarMonto(valor) {
      if (valor === '' || valor === null || valor === undefined) return 0;
      if (typeof valor === 'number') return valor;
      let texto = String(valor).replace(/\$/g, '').replace(/\./g, '').replace(/,/g, '.').replace(/\s+/g, '').trim();
      const num = Number(texto);
      return isNaN(num) ? 0 : num;
    }

    function normalizarEncabezado(h) {
      return String(h).trim().toLowerCase().replace(/\s+/g, '_');
    }

    function contarPor(datos, campo) {
      const c = {};
      datos.forEach(d => { const k = d[campo] || 'Sin dato'; c[k] = (c[k] || 0) + 1; });
      return c;
    }
    function sumarPor(datos, campo, campoMonto) {
      const c = {};
      datos.forEach(d => { const k = d[campo] || 'Sin dato'; c[k] = (c[k] || 0) + (d[campoMonto] || 0); });
      return c;
    }
    function promedioPor(datos, campo, campoMonto) {
      const suma = {}, cant = {};
      datos.forEach(d => {
        const k = d[campo] || 'Sin dato';
        suma[k] = (suma[k] || 0) + (d[campoMonto] || 0);
        cant[k] = (cant[k] || 0) + 1;
      });
      const prom = {};
      Object.keys(suma).forEach(k => { prom[k] = suma[k] / cant[k]; });
      return prom;
    }
    function ordenarYLimitar(obj, limite) {
      const entradas = Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, limite);
      return { labels: entradas.map(e => e[0]), values: entradas.map(e => e[1]) };
    }

    // ============================================================
    // PARSER CSV (soporta comillas, comas, punto y coma y tabuladores)
    // ============================================================
    function detectarSeparador(primeraLinea) {
      const conteo = { ',': 0, ';': 0, '\t': 0 };
      let enComillas = false;
      for (const ch of primeraLinea) {
        if (ch === '"') enComillas = !enComillas;
        else if (!enComillas && conteo[ch] !== undefined) conteo[ch]++;
      }
      return Object.entries(conteo).sort((a, b) => b[1] - a[1])[0][0];
    }

    function parsearCSV(texto) {
      // Quitar BOM
      if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);

      // Detectar separador usando la primera línea
      const primeraLineaFin = texto.indexOf('\n');
      const primeraLinea = primeraLineaFin >= 0 ? texto.substring(0, primeraLineaFin) : texto;
      const separador = SEPARADOR_AUTO ? detectarSeparador(primeraLinea) : ',';

      const filas = [];
      let fila = [];
      let campo = '';
      let enComillas = false;

      for (let i = 0; i < texto.length; i++) {
        const ch = texto[i];

        if (enComillas) {
          if (ch === '"') {
            if (texto[i + 1] === '"') { campo += '"'; i++; }
            else enComillas = false;
          } else campo += ch;
        } else {
          if (ch === '"') enComillas = true;
          else if (ch === separador) { fila.push(campo); campo = ''; }
          else if (ch === '\n') { fila.push(campo); filas.push(fila); fila = []; campo = ''; }
          else if (ch === '\r') { /* ignorar */ }
          else campo += ch;
        }
      }
      if (campo !== '' || fila.length > 0) { fila.push(campo); filas.push(fila); }

      return filas;
    }

    function csvARegistros(texto, origen) {
      const filas = parsearCSV(texto);
      if (filas.length < 2) return [];

      const encabezados = filas[0].map(h => normalizarEncabezado(h));
      const indices = {};
      CAMPOS_COMUNES.forEach(campo => {
        const objetivo = normalizarEncabezado(campo);
        indices[campo] = encabezados.findIndex(h => h === objetivo || h.startsWith(objetivo));
      });

      const registros = [];
      for (let r = 1; r < filas.length; r++) {
        const fila = filas[r];
        if (!fila || fila.every(c => c === '')) continue;

        const registro = { origen };
        let tieneDatos = false;

        CAMPOS_COMUNES.forEach(campo => {
          if (campo === 'origen') { registro.origen = origen; return; }
          const idx = indices[campo];
          let valor = idx >= 0 && fila[idx] !== undefined ? fila[idx] : '';

          if (campo === 'monto_total_m$') valor = normalizarMonto(valor);
          else valor = valor === null || valor === undefined ? '' : String(valor).trim();

          if (valor !== '' && valor !== 0) tieneDatos = true;
          registro[campo] = valor;
        });

        if (tieneDatos && (registro.codigo_bip || registro.nombre)) registros.push(registro);
      }

      return registros;
    }

    // ============================================================
    // CARGA DE ARCHIVO
    // ============================================================
    function mostrarMensaje(tipo, html) {
      const cont = document.getElementById('contenedorMensajes');
      const div = document.createElement('div');
      div.className = tipo;
      div.innerHTML = html;
      cont.appendChild(div);
    }

    function limpiarMensajes() {
      document.getElementById('contenedorMensajes').innerHTML = '';
    }

    async function intentarCargarCSVAutomatico() {
      try {
        const resp = await fetch(ARCHIVO_CSV, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const texto = await resp.text();
        return texto;
      } catch (e) {
        return null;
      }
    }

    function cargarCSVDesdeInput(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
        reader.readAsText(file, 'UTF-8');
      });
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    async function iniciarDesdeTexto(texto, nombreOrigen) {
      limpiarMensajes();

      document.getElementById('kpis').innerHTML = '';
      Object.keys(graficos).forEach(k => { graficos[k].destroy(); delete graficos[k]; });

      const datos = csvARegistros(texto, nombreOrigen || ARCHIVO_CSV);

      if (datos.length === 0) {
        mostrarMensaje('error', '❌ El CSV no contiene filas válidas o los encabezados no coinciden.');
        return;
      }

      datosGlobales = datos;

      mostrarMensaje('info', `✅ Cargados <b>${datos.length}</b> proyectos desde <b>${nombreOrigen || ARCHIVO_CSV}</b>.`);

      // Poblar filtros
      const selCartera = document.getElementById('filtroCartera');
      const selEstado = document.getElementById('filtroEstado');
      const selEvaluador = document.getElementById('filtroEvaluador');

      selCartera.innerHTML = '<option value="Todas">Todas</option>';
      selEstado.innerHTML = '<option value="Todos">Todos</option>';
      selEvaluador.innerHTML = '<option value="Todos">Todos</option>';

      const carteras = [...new Set(datosGlobales.map(d => d.tipo_cartera || 'Sin dato'))].sort();
      const estados = [...new Set(datosGlobales.map(d => d.estado || 'Sin dato'))].sort();
      const evaluadores = [...new Set(datosGlobales.map(d => d.evaluador || 'Sin dato'))].sort();

      carteras.forEach(c => selCartera.add(new Option(c, c)));
      estados.forEach(e => selEstado.add(new Option(e, e)));
      evaluadores.forEach(e => selEvaluador.add(new Option(e, e)));

      selCartera.onchange = actualizarTodo;
      selEstado.onchange = actualizarTodo;
      selEvaluador.onchange = actualizarTodo;

      actualizarTodo();
    }

    async function iniciarAutomatico() {
      const msg = document.createElement('div');
      msg.className = 'cargando';
      msg.id = 'msgCargando';
      msg.textContent = `⏳ Intentando leer ${ARCHIVO_CSV}…`;
      document.body.insertBefore(msg, document.body.firstChild);

      const texto = await intentarCargarCSVAutomatico();

      const msgEl = document.getElementById('msgCargando');
      if (msgEl) msgEl.remove();

      if (texto) {
        await iniciarDesdeTexto(texto, ARCHIVO_CSV);
      } else {
        mostrarMensaje('info',
          `ℹ️ No se pudo leer <code>${ARCHIVO_CSV}</code> automáticamente ` +
          `(probablemente porque abriste el HTML con doble clic y el navegador bloquea archivos locales).<br>` +
          `Selecciona el archivo manualmente con el botón de arriba 👆.`);
      }
    }

    // ============================================================
    // FILTROS
    // ============================================================
    function obtenerDatosFiltrados() {
      const fc = document.getElementById('filtroCartera').value;
      const fe = document.getElementById('filtroEstado').value;
      const fv = document.getElementById('filtroEvaluador').value;

      return datosGlobales.filter(d => {
        if (fc !== 'Todas' && (d.tipo_cartera || 'Sin dato') !== fc) return false;
        if (fe !== 'Todos' && (d.estado || 'Sin dato') !== fe) return false;
        if (fv !== 'Todos' && (d.evaluador || 'Sin dato') !== fv) return false;
        return true;
      });
    }

    function actualizarTodo() {
      const datos = obtenerDatosFiltrados();
      actualizarKPIs(datos);
      actualizarGraficos(datos);
    }

    function actualizarKPIs(datos) {
      const total = datos.length;
      const montoTotal = datos.reduce((s, d) => s + (d.monto_total_m$ || 0), 0);
      const montoProm = total > 0 ? montoTotal / total : 0;
      const comunas = new Set(datos.map(d => d.comuna).filter(Boolean)).size;

      document.getElementById('kpis').innerHTML = `
        <div class="kpi"><div class="valor">${total}</div><div class="etiqueta">Proyectos</div></div>
        <div class="kpi"><div class="valor">${comunas}</div><div class="etiqueta">Comunas</div></div>
        <div class="kpi"><div class="valor">$${formatearMonto(montoTotal)}</div><div class="etiqueta">Monto Total (m$)</div></div>
        <div class="kpi"><div class="valor">$${formatearMonto(montoProm)}</div><div class="etiqueta">Monto Promedio (m$)</div></div>
      `;
    }

    // ============================================================
    // GRÁFICOS
    // ============================================================
    function destruirGrafico(id) { if (graficos[id]) { graficos[id].destroy(); delete graficos[id]; } }

    function crearGraficoBarras(id, labels, values, titulo, color) {
      destruirGrafico(id);
      const ctx = document.getElementById(id).getContext('2d');
      graficos[id] = new Chart(ctx, {
        type: 'bar',
        data: { labels, datasets: [{ label: titulo, data: values, backgroundColor: color || paleta[0], borderRadius: 5 }] },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.parsed.x.toLocaleString('es-CL') } } },
          scales: { x: { beginAtZero: true, ticks: { callback: v => v.toLocaleString('es-CL') } } }
        }
      });
    }

    function crearGraficoDona(id, labels, values, titulo) {
      destruirGrafico(id);
      const ctx = document.getElementById(id).getContext('2d');
      graficos[id] = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: paleta.slice(0, labels.length) }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: 'right', labels: { boxWidth: 14, font: { size: 11 } } },
            tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + ctx.parsed.toLocaleString('es-CL') } }
          }
        }
      });
    }

    function actualizarGraficos(datos) {
      const estado = contarPor(datos, 'estado');
      const estadoOrd = ordenarYLimitar(estado, 12);
      crearGraficoBarras('chartEstado', estadoOrd.labels, estadoOrd.values, 'Proyectos', paleta[0]);

      const comuna = contarPor(datos, 'comuna');
      const comunaOrd = ordenarYLimitar(comuna, 15);
      crearGraficoBarras('chartComuna', comunaOrd.labels, comunaOrd.values, 'Proyectos', paleta[1]);

      const evaluador = contarPor(datos, 'evaluador');
      const evaluadorOrd = ordenarYLimitar(evaluador, 12);
      crearGraficoBarras('chartEvaluador', evaluadorOrd.labels, evaluadorOrd.values, 'Proyectos', paleta[2]);

      const montoComuna = sumarPor(datos, 'comuna', 'monto_total_m$');
      const montoComunaOrd = ordenarYLimitar(montoComuna, 15);
      crearGraficoBarras('chartMontoComuna', montoComunaOrd.labels, montoComunaOrd.values, 'Monto (m$)', paleta[3]);

      const promCartera = promedioPor(datos, 'tipo_cartera', 'monto_total_m$');
      const carteraLabels = Object.keys(promCartera);
      const carteraValues = carteraLabels.map(k => promCartera[k]);
      crearGraficoDona('chartMontoCartera', carteraLabels, carteraValues, 'Monto promedio');

      const tipoIni = contarPor(datos, 'tipo_iniciativa');
      const tipoIniOrd = ordenarYLimitar(tipoIni, 10);
      crearGraficoDona('chartTipoIniciativa', tipoIniOrd.labels, tipoIniOrd.values, 'Proyectos');

      const carteras = [...new Set(datos.map(d => d.tipo_cartera || 'Sin dato'))];
      const rangos = ['0-50k', '50k-100k', '100k-200k', '200k-500k', '>500k'];
      const distribucion = {};
      carteras.forEach(c => distribucion[c] = [0, 0, 0, 0, 0]);

      datos.forEach(d => {
        const c = d.tipo_cartera || 'Sin dato';
        const m = d.monto_total_m$ || 0;
        let idx = 0;
        if (m > 500000) idx = 4;
        else if (m > 200000) idx = 3;
        else if (m > 100000) idx = 2;
        else if (m > 50000) idx = 1;
        distribucion[c][idx]++;
      });

      destruirGrafico('chartBoxMonto');
      const ctxBox = document.getElementById('chartBoxMonto').getContext('2d');
      graficos['chartBoxMonto'] = new Chart(ctxBox, {
        type: 'bar',
        data: {
          labels: rangos,
          datasets: carteras.map((c, i) => ({ label: c, data: distribucion[c], backgroundColor: paleta[i % paleta.length], borderRadius: 4 }))
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
        }
      });

      const formulador = contarPor(datos, 'formulador');
      const formuladorOrd = ordenarYLimitar(formulador, 10);
      crearGraficoBarras('chartFormulador', formuladorOrd.labels, formuladorOrd.values, 'Proyectos', paleta[5]);
    }

    // ============================================================
    // EVENTOS
    // ============================================================
    document.getElementById('inputArchivo').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const texto = await cargarCSVDesdeInput(file);
        await iniciarDesdeTexto(texto, file.name);
      } catch (err) {
        limpiarMensajes();
        mostrarMensaje('error', '❌ ' + err.message);
      }
    });

    document.getElementById('btnRecargar').addEventListener('click', async () => {
      const texto = await intentarCargarCSVAutomatico();
      if (texto) await iniciarDesdeTexto(texto, ARCHIVO_CSV);
      else mostrarMensaje('error', `❌ No se pudo leer ${ARCHIVO_CSV}. Selecciona el archivo manualmente.`);
    });

    // Arrancar
    iniciarAutomatico();
  </script>
</body>
</html>
